name: CI

on:
  push:
  pull_request:

# Least privilege: CI only reads the code. No repository secrets are used anywhere in this workflow.
permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0          # scan the full history, not just the last commit
          persist-credentials: false
      - name: Airmed secret scan (tracked files)
        run: python3 tools/leak_scan.py
      - name: Gitleaks (full history)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum -c -   # official checksum
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --no-banner --verbose

  tests:
    name: Tests and registry check
    runs-on: ubuntu-24.04
    needs: secrets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Offline tests
        run: python -m unittest discover -s tests -t . -v
      - name: Every collector matches an approved registry entry
        run: python -m airmed check
