name: CI

on:
  push:
  pull_request:

# Least privilege: CI only reads the code. No repository secrets are used anywhere in this workflow.
permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # scan the full history, not just the last commit
          persist-credentials: false
      - name: Airmed secret scan (tracked files)
        run: python3 tools/secret_scan.py
      - name: Gitleaks (full history)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --no-banner --verbose

  tests:
    name: Tests and registry check
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline tests
        run: python -m unittest discover -s tests -t . -v
      - name: Every collector matches an approved registry entry
        run: python -m airmed check
